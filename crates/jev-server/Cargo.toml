[package]
name = "jev-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "jev-server"
path = "src/main.rs"

[dependencies]
jev-core = { path = "../jev-core" }
jev-backend = { path = "../jev-backend" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
# The benchmark binary probes the endpoint's `/get_server_info` (SGLang version,
# "if available" per specs/M1.md §4). Same crate version and features as the one
# `jev-backend` already depends on, so this resolves to the already-locked,
# already-cached copy — no new download.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the router in-process (no port, no GPU, no
# network): the no-GPU end-to-end tests in `tests/` use it.
tower = { version = "0.5", features = ["util"] }
# The end-to-end tests need one backend of their own that *records* what the API
# layer asked for (prompt + top_k), which requires implementing `DecisionBackend`.
async-trait = "0.1"
