[workspace]
resolver = "2"
members = [
    "crates/jev-core",
    "crates/jev-backend",
    "crates/jev-server",
    "crates/jev-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "TBD"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
